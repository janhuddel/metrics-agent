# Default Configuration
# This file contains default settings

# Logging configuration
logging:
  level: info

# Controller configuration
controller:
  graceful_shutdown_timeout: 30s
  hard_shutdown_timeout: 5s
  
# Storage configuration
storage:
  path: ./.data

# Retry configuration
retry:
  max_retries: 3
  base_delay: 1s
  max_delay: 30s
